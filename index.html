<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScentVault - Catálogo Inteligente</title>
    <!-- Librería Chart.js para el Dashboard de Estadísticas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --pastel-blue: rgba(162, 210, 255, 0.15);
            --pastel-blue-text: #a2d2ff; --pastel-pink: rgba(255, 175, 204, 0.15); --pastel-pink-text: #ffafcc;
            --pastel-purple: rgba(205, 180, 219, 0.15); --pastel-purple-text: #cdb4db;
            --text-main: #f0f0f0; --text-muted: #a0a0a0; --primary-btn: #bb86fc; --card-border: #2c2c2c;
        }

        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 2rem; }
        h1 { text-align: center; margin-bottom: 0.5rem; letter-spacing: 1px; color: var(--primary-btn); }
        
        /* Banner de Clima */
        #weather-banner { background: #252525; border: 1px solid var(--primary-btn); border-radius: 12px; padding: 1rem; text-align: center; max-width: 600px; margin: 0 auto 2rem auto; font-size: 0.9rem; }
        
        /* Barra de herramientas (Buscador y Stats) */
        .toolbar { display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .search-input { padding: 0.8rem 1.5rem; border-radius: 25px; border: 1px solid #3d3d3d; background: #2c2c2c; color: white; width: 100%; max-width: 400px; font-size: 1rem; outline: none; }
        .search-input:focus { border-color: var(--primary-btn); }
        .action-btn { background-color: var(--primary-btn); color: #000; border: none; padding: 0.8rem 1.5rem; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .action-btn:hover { background-color: #a361ef; }

        .filters-container { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
        .filter-btn { background-color: #2c2c2c; border: 1px solid #3d3d3d; padding: 0.6rem 1.2rem; border-radius: 20px; color: var(--text-main); cursor: pointer; transition: 0.2s; }
        .filter-btn.active, .filter-btn:hover { background-color: var(--primary-btn); color: #121212; font-weight: bold; }

        #catalog-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; max-width: 1300px; margin: 0 auto; }
        .fragrance-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: 0.2s; }
        .fragrance-card:hover { transform: translateY(-5px); border-color: var(--primary-btn); }
        .fragrance-image { width: 100%; height: 260px; object-fit: cover; opacity: 0.9; }
        .card-content { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .brand-name { font-size: 0.85rem; color: var(--primary-btn); text-transform: uppercase; margin-bottom: 0.3rem; font-weight: bold; }
        .fragrance-name { font-size: 1.4rem; margin: 0 0 1rem 0; }
        .badge-fav { background: #ff4757; color: white; padding: 0.2rem 0.5rem; border-radius: 5px; font-size: 0.7rem; float: right; }

        .note-badge { padding: 0.3rem 0.7rem; border-radius: 15px; font-size: 0.75rem; font-weight: 600; border: 1px solid transparent; display: inline-block; margin: 0.2rem; }
        .top-note { background-color: var(--pastel-blue); color: var(--pastel-blue-text); }
        .heart-note { background-color: var(--pastel-pink); color: var(--pastel-pink-text); }
        .base-note { background-color: var(--pastel-purple); color: var(--pastel-purple-text); }

        /* Modales */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background-color: var(--card-bg); width: 90%; max-width: 900px; border-radius: 16px; border: 1px solid var(--primary-btn); display: flex; flex-direction: row; position: relative; max-height: 90vh; }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 2rem; color: white; cursor: pointer; z-index: 10; background: rgba(0,0,0,0.5); border-radius: 50%; width: 40px; height: 40px; text-align: center; line-height: 1; }
        .modal-media { flex: 1; background: #000; display: flex; }
        .modal-image { width: 100%; height: 100%; object-fit: cover; }
        .modal-info { flex: 1; padding: 2rem; overflow-y: auto; }
        
        .buy-btn { display: block; width: 100%; text-align: center; background-color: #333; color: white; padding: 1rem; border-radius: 8px; text-decoration: none; font-weight: bold; margin: 1rem 0; border: 1px solid #444;}
        .fav-btn { display: block; width: 100%; text-align: center; background-color: var(--primary-btn); color: #000; padding: 1rem; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; margin-bottom: 1rem;}
        
        .stats-container { padding: 2rem; width: 100%; text-align: center; overflow-y: auto;}
        .chart-wrapper { max-width: 400px; margin: 0 auto; }

        @media (max-width: 768px) { .modal-content { flex-direction: column; overflow-y: auto; } .modal-media { min-height: 300px; } }
    </style>
</head>
<body>

    <h1>ScentVault</h1>
    <p style="text-align: center; color: var(--text-muted); margin-top: 0;">Tu Colección Inteligente de Fragancias</p>

    <!-- Banner de Clima Dinámico -->
    <div id="weather-banner">
        ⏳ Obteniendo clima local para darte recomendaciones...

    <!-- Buscador y Dashboard -->

        <button class="filter-btn" onclick="filterCatalog('Frío')">❄️ Clima Frío</button>
        <button class="filter-btn" onclick="filterCatalog('Cálido')">☀️ Clima Cálido</button>
        <button class="filter-btn" onclick="filterCatalog('Citas')">🍷 Citas</button>

    <div id="catalog-container"></div>

    <!-- Modal Detalle del Perfume -->
    <div id="perfume-modal" class="modal-overlay" onclick="closeModal(event, 'perfume-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal(null, 'perfume-modal')">×</span>
            <div id="modal-body" style="display: flex; width: 100%; height: 100%; flex-wrap: wrap;"></div>
        </div>
    </div>

    <!-- Modal de Estadísticas (Dashboard) -->
    <div id="stats-modal" class="modal-overlay" onclick="closeModal(event, 'stats-modal')">

                </div>
                <p id="stats-msg" style="margin-top: 2rem;"></p>
            </div>
        </div>
    </div>

        // --- 2. SISTEMA DE "MI COLECCIÓN" (LocalStorage) ---
        let myCollection = JSON.parse(localStorage.getItem('scently_collection')) || [];

        function toggleFavorite(id) {
            if (myCollection.includes(id)) {
                myCollection = myCollection.filter(favId => favId !== id);
            } else {
                myCollection.push(id);
            }
            localStorage.setItem('scently_collection', JSON.stringify(myCollection));
            renderCards(fragrancesDB); // Actualiza la vista
            closeModal(null, 'perfume-modal'); // Cierra el modal para ver los cambios
        }

        // --- 3. RENDERIZADO Y BUSCADOR AVANZADO ---
        const container = document.getElementById('catalog-container');

        function createBadgesHTML(notesArray, cssClass) {
            return notesArray.map(note => `<span class="note-badge ${cssClass}">${note}</span>`).join('');
        }

        function renderCards(data) {
            container.innerHTML = '';
            if(data.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No encontramos nada, manito. Intenta otra búsqueda.</p>';
                return;
            }
            data.forEach(fragrance => {
                const isFav = myCollection.includes(fragrance.id);
                const card = document.createElement('div');
                card.className = 'fragrance-card';
                card.onclick = () => openModal(fragrance.id);

                card.innerHTML = `
                    <div style="position: relative;">
                        <img src="${fragrance.image}" class="fragrance-image" onerror="this.src='https://via.placeholder.com/600x400/222/666?text=Imagen+Local'">
                        ${isFav ? '<div style="position: absolute; top: 10px; right: 10px; font-size: 1.5rem;">❤️</div>' : ''}
                    </div>
                    <div class="card-content">
                        <div class="brand-name">${fragrance.brand}</div>
                        <h2 class="fragrance-name">${fragrance.name}</h2>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            
            const filtered = fragrancesDB.filter(f => {
                // Busca en nombre y marca
                const inNameBrand = f.name.toLowerCase().includes(query) || f.brand.toLowerCase().includes(query);
                // Busca en todas las notas
                const allNotes = [...f.notes.top, ...f.notes.heart, ...f.notes.base].join(' ').toLowerCase();
                const inNotes = allNotes.includes(query);
                
                return inNameBrand || inNotes;
            });
            renderCards(filtered);
        }

        function filterCatalog(filterType) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('search-input').value = ''; // Limpia buscador

            if (filterType === 'Todos') {
                renderCards(fragrancesDB);
            } else if (filterType === 'MiColeccion') {
                const favs = fragrancesDB.filter(f => myCollection.includes(f.id));
                renderCards(favs);
            } else {
                const filtered = fragrancesDB.filter(f => f.contexts.weather.includes(filterType) || f.contexts.events.includes(filterType));
                renderCards(filtered);
            }
        }

        // --- 4. MODAL DE DETALLE ---
        function openModal(id) {
            const f = fragrancesDB.find(item => item.id === id);
            const isFav = myCollection.includes(f.id);
            const modalBody = document.getElementById('modal-body');

            modalBody.innerHTML = `
                <div class="modal-media">
                    <img src="${f.image}" class="modal-image" onerror="this.src='https://via.placeholder.com/600x800/222/666?text=Imagen'">
                </div>
                <div class="modal-info">
                    <div class="brand-name">${f.brand}</div>
                    <h2>${f.name}</h2>
                    <p style="color: #ffd700;">★ ${f.review.score}/5</p>
                    
                    <h3>Notas:</h3>
                    ${createBadgesHTML(f.notes.top, 'top-note')}
                    ${createBadgesHTML(f.notes.heart, 'heart-note')}
                    ${createBadgesHTML(f.notes.base, 'base-note')}

                    <p style="margin-top: 1.5rem; font-style: italic; color: #ccc;">"${f.review.text}"</p>

                    <button class="fav-btn" onclick="toggleFavorite(${f.id})">
                        ${isFav ? '❌ Quitar de Mi Colección' : '❤️ Agregar a Mi Colección'}
                    </button>
                    <a href="https://www.amazon.com.mx/s?k=${encodeURIComponent(f.brand + ' ' + f.name)}" target="_blank" class="buy-btn">🛒 Buscar para Comprar</a>
                </div>
            `;
            document.getElementById('perfume-modal').style.display = 'flex';
        }

        function closeModal(e, modalId) {
            const modal = document.getElementById(modalId);
            if(e && e.target !== modal) return;
            modal.style.display = 'none';
        }

        // --- 5. DASHBOARD ESTADÍSTICO (Chart.js) ---
        let myChartInstance = null;

        function openStatsModal() {
            if(myCollection.length === 0) {
                alert("Manito, tu colección está vacía. Agrega perfumes primero usando el botón ❤️ en los detalles.");
                return;
            }

            // Contar notas
            let noteCounts = {};
            myCollection.forEach(id => {
                const f = fragrancesDB.find(x => x.id === id);
                if(f) {
                    const allNotes = [...f.notes.top, ...f.notes.heart, ...f.notes.base];
                    allNotes.forEach(note => {
                        noteCounts[note] = (noteCounts[note] || 0) + 1;
                    });
                }
            });

            // Ordenar y sacar el Top 5
            const sortedNotes = Object.entries(noteCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const labels = sortedNotes.map(n => n[0]);
            const data = sortedNotes.map(n => n[1]);

            document.getElementById('stats-modal').style.display = 'flex';
            document.getElementById('stats-msg').innerText = `Tu colección tiene una fuerte tendencia hacia la nota de ${labels[0]}. ¡Excelente gusto!`;

            // Renderizar gráfica
            const ctx = document.getElementById('myChart').getContext('2d');
            if(myChartInstance) myChartInstance.destroy(); // Borrar gráfica vieja si existe

            myChartInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#bb86fc', '#ffafcc', '#a2d2ff', '#cdb4db', '#ffd700'],
                        borderWidth: 0
                    }]
                },
                options: { plugins: { legend: { labels: { color: '#fff' } } } }
            });
        }

        // --- 6. API DE CLIMA (OpenWeatherMap) ---
        // IMPORTANTE: Crea una cuenta en openweathermap.org y pon tu API Key aquí abajo
        const WEATHER_API_KEY = 'TU_API_KEY_AQUI'; 

        function getRecommendationByTemp(temp) {
            if(temp < 15) return "❄️ Hace frío. Sugerimos perfumes dulces, amaderados o con cuero (ej. Ombré Leather, 9PM).";
            if(temp >= 15 && temp < 25) return "⛅ Clima templado. Ideal para maderas suaves, iris o cítricos oscuros (ej. Y EDP, Uomo Intense).";
            return "☀️ ¡Hace calor, manito! Usa cítricos, acuáticos o frutales para no asfixiar a nadie (ej. Hawas Ice, Profondo).";
        }

        function fetchWeather() {
            const banner = document.getElementById('weather-banner');
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    // Si pones tu API Key, descomenta estas líneas y borra el código "Simulado" de abajo
                    /*
                    fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${WEATHER_API_KEY}&lang=es`)
                        .then(response => response.json())
                        .then(data => {
                            const temp = Math.round(data.main.temp);
                            banner.innerHTML = `📍 <strong>${data.name}</strong> | 🌡️ ${temp}°C - ${data.weather[0].description} <br> <span style="color: var(--primary-btn);">${getRecommendationByTemp(temp)}</span>`;
                        })
                        .catch(() => banner.innerHTML = "No pudimos conectar con el satélite de clima.");
                    */

                    // --- CÓDIGO SIMULADO MIENTRAS CONSIGUES TU API KEY ---
                    const temp = 14; // Simulando 14 grados en Puebla
                    banner.innerHTML = `📍 <strong>Clima Local Detectado</strong> | 🌡️ ${temp}°C <br> <span style="color: var(--primary-btn);">${getRecommendationByTemp(temp)}</span>`;
                    
                }, () => {
                    banner.innerHTML = "Activa tu ubicación para darte recomendaciones olfativas basadas en el clima real.";
                });
            }
        }

        // --- INICIALIZACIÓN ---
        renderCards(fragrancesDB);
        fetchWeather();

    </script>
</body>
</html>
