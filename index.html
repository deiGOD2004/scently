<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FragranceFlow - Catálogo Premium</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --pastel-blue: rgba(162, 210, 255, 0.15);
            --pastel-blue-text: #a2d2ff;
            --pastel-pink: rgba(255, 175, 204, 0.15);
            --pastel-pink-text: #ffafcc;
            --pastel-purple: rgba(205, 180, 219, 0.15);
            --pastel-purple-text: #cdb4db;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            --primary-btn: #bb86fc;
            --card-border: #2c2c2c;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        h1 { text-align: center; margin-bottom: 1.5rem; letter-spacing: 1px; }

        .filters-container {
            display: flex; justify-content: center; gap: 1rem; margin-bottom: 2.5rem; flex-wrap: wrap;
        }

        .filter-btn {
            background-color: #2c2c2c; border: 1px solid #3d3d3d; padding: 0.6rem 1.2rem;
            border-radius: 20px; color: var(--text-main); cursor: pointer; transition: all 0.2s ease;
        }
        .filter-btn:hover { background-color: #3d3d3d; }
        .filter-btn.active { background-color: var(--primary-btn); color: #121212; font-weight: bold; }

        #catalog-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; max-width: 1300px; margin: 0 auto;
        }

        .fragrance-card {
            background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s;
            display: flex; flex-direction: column;
        }
        .fragrance-card:hover { transform: translateY(-5px); border-color: var(--primary-btn); }

        .fragrance-image { width: 100%; height: 260px; object-fit: cover; border-bottom: 1px solid var(--card-border); opacity: 0.9; background-color: #111; }
        .fragrance-card:hover .fragrance-image { opacity: 1; }

        .card-content { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .brand-name { font-size: 0.85rem; color: var(--primary-btn); text-transform: uppercase; margin-bottom: 0.3rem; font-weight: bold; }
        .fragrance-name { font-size: 1.4rem; margin: 0 0 1rem 0; }
        .click-hint { font-size: 0.85rem; color: #aaa; text-align: center; margin-top: auto; padding-top: 1rem;}

        .note-badge { padding: 0.3rem 0.7rem; border-radius: 15px; font-size: 0.75rem; font-weight: 600; border: 1px solid transparent; display: inline-block; margin: 0.2rem; }
        .top-note { background-color: var(--pastel-blue); color: var(--pastel-blue-text); }
        .heart-note { background-color: var(--pastel-pink); color: var(--pastel-pink-text); }
        .base-note { background-color: var(--pastel-purple); color: var(--pastel-purple-text); }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: var(--card-bg); width: 90%; max-width: 900px; border-radius: 16px;
            border: 1px solid var(--primary-btn); display: flex; flex-direction: row; overflow: hidden;
            position: relative; max-height: 90vh;
        }

        .modal-close {
            position: absolute; top: 15px; right: 20px; font-size: 2rem; color: white;
            cursor: pointer; z-index: 10; line-height: 1; background: rgba(0,0,0,0.5); border-radius: 50%; width: 40px; height: 40px; text-align: center;
        }

        .modal-media { flex: 1; background: #000; display: flex; }
        .modal-image { width: 100%; height: 100%; object-fit: cover; }

        .modal-info { flex: 1; padding: 2rem; overflow-y: auto; }
        .buy-btn {
            display: block; width: 100%; text-align: center; background-color: var(--primary-btn); color: #000;
            padding: 1rem; border-radius: 8px; text-decoration: none; font-weight: bold; margin: 1.5rem 0;
            transition: background 0.2s; box-sizing: border-box;
        }
        .buy-btn:hover { background-color: #a361ef; }

        .similar-tag {
            background: #333; padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.8rem;
            cursor: pointer; display: inline-block; margin: 0.2rem; transition: background 0.2s;
        }
        .similar-tag:hover { background: var(--primary-btn); color: #000; }

        @media (max-width: 768px) {
            .modal-content { flex-direction: column; overflow-y: auto; }
            .modal-media { min-height: 350px; }
            .modal-info { overflow-y: visible; }
        }
    </style>
</head>
<body>

    <h1>Scently</h1>

    <div class="filters-container">

            <div id="modal-body" style="display: flex; width: 100%; height: 100%; flex-wrap: wrap;"></div>
        </div>
    </div>

            { id: 21, name: "Fakhar Black", brand: "Lattafa", image: "img/21.jpg", notes: { top: ["Manzana", "Jengibre", "Bergamota"], heart: ["Lavanda", "Salvia"], base: ["Haba Tonka", "Vetiver"] }, contexts: { weather: ["Templado", "Cálido"], events: ["Universidad", "Oficina", "Casual"] }, similarIds: [1], review: { text: "Clon excelente de YSL Y EDP. Fresco, afrutado y versátil a una fracción del precio.", score: 4.6 } },
            { id: 22, name: "Odyssey Homme Black", brand: "Armaf", image: "img/22.jpg", notes: { top: ["Vainilla", "Ámbar"], heart: ["Iris", "Especias"], base: ["Cuero", "Jazmín"] }, contexts: { weather: ["Frío"], events: ["Citas", "Noche", "Formal"] }, similarIds: [5, 2], review: { text: "Oscuro, dulce y atalcado. Recuerda mucho a Valentino Uomo Intense y Tom Ford Noir.", score: 4.5 } },

            { id: 24, name: "9 PM", brand: "Afnan", image: "img/24.jpg", notes: { top: ["Manzana", "Canela", "Lavanda"], heart: ["Flor de azahar"], base: ["Vainilla", "Haba Tonka"] }, contexts: { weather: ["Frío", "Fresco"], events: ["Antro", "Fiesta"] }, similarIds: [6, 17], review: { text: "Inspirado en Ultra Male pero con esteroides. Para llamar la atención en la discoteca.", score: 4.8 } },

            { id: 30, name: "Detour Noir", brand: "Al Haramain", image: "img/30.jpg", notes: { top: ["Manzana", "Lavanda"], heart: ["Vainilla", "Especias"], base: ["Sándalo", "Madera de gaiac"] }, contexts: { weather: ["Frío", "Templado"], events: ["Citas", "Noche", "Casual"] }, similarIds: [2], review: { text: "El frasco es feo, pero el jugo es oro. Clon de PDM Layton: manzana, vainilla y maderas.", score: 4.7 } }
        ];

        const container = document.getElementById('catalog-container');
        const modal = document.getElementById('perfume-modal');
        const modalBody = document.getElementById('modal-body');

        function createBadgesHTML(notesArray, cssClass) {
            return notesArray.map(note => `<span class="note-badge ${cssClass}">${note}</span>`).join('');
        }

        function renderCards(data) {
            container.innerHTML = '';
            data.forEach(fragrance => {
                const card = document.createElement('div');
                card.className = 'fragrance-card';
                card.onclick = () => openModal(fragrance.id);

                card.innerHTML = `
                    <img src="${fragrance.image}" alt="${fragrance.name}" class="fragrance-image" loading="lazy" onerror="this.src='https://via.placeholder.com/600x400/222/666?text=Imagen+Local+No+Encontrada'">
                    <div class="card-content">
                        <div class="brand-name">${fragrance.brand}</div>
                        <h2 class="fragrance-name">${fragrance.name}</h2>
                        <div class="click-hint">👇 Clic para ver detalles</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(id) {
            const f = fragrancesDB.find(item => item.id === id);
            if(!f) return;

            const searchUrl = `https://www.amazon.com.mx/s?k=${encodeURIComponent(f.brand + ' ' + f.name + ' perfume')}`;

            let similarHTML = '';
            f.similarIds.forEach(simId => {
                const simPerfume = fragrancesDB.find(item => item.id === simId);
                if(simPerfume) {
                    similarHTML += `<span class="similar-tag" onclick="openModal(${simId})">${simPerfume.name}</span>`;
                }
            });

            modalBody.innerHTML = `
                <div class="modal-media">
                    <img src="${f.image}" class="modal-image" onerror="this.src='https://via.placeholder.com/600x800/222/666?text=Imagen+Local'">
                </div>
                <div class="modal-info">
                    <div class="brand-name">${f.brand}</div>
                    <h2 class="fragrance-name" style="margin-bottom: 0.5rem;">${f.name}</h2>
                    <p style="color: #ffd700;">★ ${f.review.score}/5</p>
                    
                    <h3 style="font-size: 1rem;">Notas Olfativas:</h3>
                    ${createBadgesHTML(f.notes.top, 'top-note')}
                    ${createBadgesHTML(f.notes.heart, 'heart-note')}
                    ${createBadgesHTML(f.notes.base, 'base-note')}

                    <h3 style="font-size: 1rem; margin-top: 1.5rem;">Reseña:</h3>
                    <p style="color: #ccc; font-style: italic;">"${f.review.text}"</p>

                    <a href="${searchUrl}" target="_blank" class="buy-btn">🛒 Buscar y Comprar ahora</a>

                    <h3 style="font-size: 1rem; margin-top: 1.5rem; border-top: 1px solid #333; padding-top: 1rem;">Perfumes Similares:</h3>
                    <div>${similarHTML}</div>
                </div>
            `;

            modal.style.display = 'flex';
        }

        function closeModal(e) {
            if(e && e.target !== modal) return;
            modal.style.display = 'none';
            modalBody.innerHTML = ''; 
        }

        function filterCatalog(filterType) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (filterType === 'Todos') {
                renderCards(fragrancesDB);
            } else {
                const filteredData = fragrancesDB.filter(fragrance => {
                    const isAllWeather = fragrance.contexts.weather.includes("Todo clima");
                    const matchesWeather = fragrance.contexts.weather.includes(filterType) || isAllWeather;
                    const matchesEvent = fragrance.contexts.events.includes(filterType);
                    return matchesWeather || matchesEvent;
                });
                renderCards(filteredData);
            }
        }

        renderCards(fragrancesDB);
    </script>
</body>
</html>
