<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ScentVault: catálogo inteligente de fragancias con filtros por clima y ocasión, colección personal y perfil olfativo.">
    <title>ScentVault - Catálogo Inteligente</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>ScentVault</h1>
        <p class="subtitle">Tu Colección Inteligente de Fragancias</p>
    </header>

    <!-- Banner de clima dinámico -->
    <div id="weather-banner">
        ⏳ Obteniendo clima local para darte recomendaciones...
    </div>

    <!-- Buscador y dashboard -->
    <div class="toolbar">
        <input type="text" id="search-input" class="search-input" placeholder="Buscar notas (ej. Vainilla, Cuero), marca o nombre...">
        <button id="stats-btn" class="action-btn">📊 Mi Perfil Olfativo</button>
    </div>

    <!-- Filtros rápidos -->
    <nav class="filters-container">
        <button class="filter-btn active" data-filter="Todos">Catálogo Completo</button>
        <button class="filter-btn" data-filter="MiColeccion">❤️ Mi Colección</button>
        <button class="filter-btn" data-filter="Frío">❄️ Clima Frío</button>
        <button class="filter-btn" data-filter="Cálido">☀️ Clima Cálido</button>
        <button class="filter-btn" data-filter="Citas">🍷 Citas</button>
    </nav>

    <main id="catalog-container"></main>

    <!-- Modal: detalle del perfume -->
    <div id="perfume-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" aria-label="Cerrar">×</button>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- Modal: estadísticas (dashboard) -->
    <div id="stats-modal" class="modal-overlay">
        <div class="modal-content column">
            <button class="modal-close" aria-label="Cerrar">×</button>
            <div class="stats-container">
                <h2>📊 Tu ADN Olfativo</h2>
                <p class="muted">Basado en las notas de los perfumes de "Mi Colección"</p>
                <div class="chart-wrapper">
                    <canvas id="myChart"></canvas>
                </div>
                <p id="stats-msg"></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
